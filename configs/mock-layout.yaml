# MockGame 单一真源布局配置(M0 §7/§8)
# 解析:DH2.Core.Config.MockLayoutConfig
# 坐标原点为客户区左上角(0,0),单位像素(@100% 缩放 = DIP)

profile: mock_800x600

window:
  width: 800
  height: 600

# 任务追踪栏(底 #1E1E2E,边框 2px #555555,白字 20px:`师门任务 ({n}/20)`)
taskbar:
  x: 16
  y: 16
  width: 320
  height: 88

# 状态文本(白字 18px;左对齐,自适应宽高)
status:
  x: 16
  y: 116

# 主按钮(底 #2D5BFF,白字:`前往`/`返回`)
button:
  x: 16
  y: 180
  width: 140
  height: 48

# 状态机计时(技术设计 §7)
stateTimings:
  pathfindingMs: 2000        # Idle → Pathfinding 持续时间 → Arrived

# 临时目录(可含 %TEMP%/其它环境变量;由 MockGame 启动时展开)
tempDir: "%TEMP%/dh2-mockgame"